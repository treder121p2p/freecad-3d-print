version: "3.8"

services:
  freecad:
    build: .
    container_name: freecad-3d
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-9876}:9876"
      - "${RPC_PORT:-9875}:9875"
      - "${NOVNC_PORT:-6080}:6080"
    environment:
      - POLZA_API_KEY=${POLZA_API_KEY}
      - POLZA_MODEL=${POLZA_MODEL:-xiaomi/mimo-v2.5}
    volumes:
      - freecad-data:/workspace
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "bash", "-c", "netstat -tlnp | grep -q 9876"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  freecad-data:
